    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:#173c31;color:#edf4df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;grid-template-rows:auto 1fr auto;overflow-wrap:anywhere}header,footer{padding:28px clamp(22px,5vw,70px);display:flex;justify-content:space-between;align-items:center}a{color:inherit;text-decoration:none;font-size:13px}a:hover{text-decoration:underline}a:focus-visible{outline:2px solid #d8edba;outline-offset:7px}.brand{font-weight:700;font-size:28px;letter-spacing:-1.5px}.brand span{color:#b8d89b}.route{font-size:11px;letter-spacing:2px;color:#a2bba5}main{position:relative;isolation:isolate;display:grid;place-content:center;text-align:center;padding:65px 20px}main::before{content:"";position:absolute;z-index:-1;width:min(75vw,670px);aspect-ratio:1;border:1px solid #c8e5a41a;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#33563c80,transparent 70%)}.eyebrow{color:#b3d694;font-size:11px;font-weight:600;letter-spacing:4px;margin:0 0 28px}.spark{color:#cce7a8;font-size:42px;margin-bottom:25px}h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(36px,8.4vw,140px);letter-spacing:-.055em;line-height:1.1;margin:0;animation:arrive .7s ease-out both}h1 span{color:#c5e29e}.underline{width:60px;height:3px;background:#c5e29e;margin:32px auto;border-radius:5px}.subtitle{font-size:13px;letter-spacing:.5px;color:#aec1ab;margin:0}.back{display:inline-block;justify-self:center;margin-top:44px;border:1px solid #c5e29e40;border-radius:30px;padding:13px 22px;color:#d9e8cb;transition:background .2s}.back:hover{background:#ffffff0c;text-decoration:none}footer{color:#93ad94;font-size:10px;border-top:1px solid #ffffff0b;gap:20px}@keyframes arrive{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){h1{animation:none}}@media(max-width:450px){header,footer{padding:22px}.eyebrow{font-
